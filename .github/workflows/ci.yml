name: CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check .
      - run: python -m pytest
      - run: python -m monedas --demo --sin-ventana --duracion 25
      - run: python cad/generar_cad.py --check
      - name: El visor 3D se puede reconstruir
        run: python visor3d/construir.py
